  <style>

<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/framer-motion@11.16.4/dist/framer-motion.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext, Children } = React;
    const { motion, AnimatePresence } = window.Motion;

    /* ════════════ ROUTER SHIM ════════════ */
    const RouterContext = createContext({ location: { pathname: "/", hash: "" }, navigate: () => {} });
    const getHashPath = () => (window.location.hash.replace(/^#/, "") || "/");
    function Router({ children }) {
      const [location, setLocation] = useState(() => ({ pathname: getHashPath() }));
      useEffect(() => {
        const onHash = () => setLocation({ pathname: getHashPath() });
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);
      const navigate = useCallback((to, opts = {}) => {
        if (opts.replace) { history.replaceState(null, "", "#" + to); setLocation({ pathname: getHashPath() }); }
        else { window.location.hash = to; window.scrollTo({ top: 0, left: 0 }); }
      }, []);
      return <RouterContext.Provider value={{ location, navigate }}>{children}</RouterContext.Provider>;
    }
    const useRouter = () => useContext(RouterContext);
    const useLocation = () => useRouter().location;
    const useNavigate = () => useRouter().navigate;
    const ParamsContext = createContext({});
    const useParams = () => useContext(ParamsContext);
    const OutletContext = createContext(null);
    function Outlet() { return useContext(OutletContext); }
    function matchPath(pattern, pathname) {
      if (pattern === "*") return {};
      const pSeg = pattern.split("/").filter(Boolean);
      const aSeg = pathname.split("/").filter(Boolean);
      const params = {};
      for (let i = 0; i < pSeg.length; i++) {
        if (pSeg[i].startsWith(":")) { params[pSeg[i].slice(1)] = decodeURIComponent(aSeg[i] || ""); }
        else if (pSeg[i] !== aSeg[i]) return null;
      }
      if (pSeg.length !== aSeg.length) return null;
      return params;
    }
    function Route() { return null; }
    function Routes({ children }) {
      const { location } = useRouter();
      const pathname = location.pathname;
      const childArr = Children.toArray(children).filter((c) => c.type === Route);
      for (const route of childArr) {
        const { path, element } = route.props;
        if (path === undefined) {
          const nested = Children.toArray(route.props.children).filter((c) => c.type === Route);
          for (const n of nested) {
            const params = matchPath(n.props.path || "/", pathname);
            if (params) return <ParamsContext.Provider value={params}><OutletContext.Provider value={n.props.element}>{element}</OutletContext.Provider></ParamsContext.Provider>;
          }
        } else {
          const params = matchPath(path, pathname);
          if (params) return <ParamsContext.Provider value={params}>{element}</ParamsContext.Provider>;
        }
      }
      return null;
    }
    function Navigate({ to, replace }) { const navigate = useNavigate(); useEffect(() => { navigate(to, { replace }); }, []); return null; }
    function Link({ to, children, ...rest }) { const navigate = useNavigate(); return <a href={"#" + to} onClick={(e) => { e.preventDefault(); navigate(to); }} {...rest}>{children}</a>; }
    function NavLink({ to, end, children, className, ...rest }) {
      const { location } = useRouter();
      const active = end ? location.pathname === to : location.pathname === to || location.pathname.startsWith(to + "/");
      const cls = typeof className === "function" ? className({ isActive: active }) : className;
      return <a href={"#" + to} onClick={(e) => { e.preventDefault(); navigate(to); }} className={cls} {...rest}>{typeof children === "function" ? children({ isActive: active }) : children}</a>;
    }
    function ScrollToTop() {
      const { pathname } = useLocation();
      useEffect(() => { window.scrollTo({ top: 0, left: 0 }); }, [pathname]);
      return null;
    }

    /* ════════════ MATH LOGIC ════════════ */
    const ok = (steps, finalAnswer) => ({ steps, finalAnswer });
    const err = (msg) => ({ error: msg });
    const parseSet = (str) => str.split(",").map((s) => s.trim()).filter((s) => s !== "");
    const makeUnique = (arr) => { const seen = {}, out = []; for (const x of arr) if (!seen[x]) { seen[x] = true; out.push(x); } return out; };
    const fmtSet = (arr) => "{" + arr.join(", ") + "}";
    const solveSetUnion = (aStr, bStr) => { const a = parseSet(aStr), b = parseSet(bStr); if (!a.length || !b.length) return err("Enter values for both sets."); const u = makeUnique(a.concat(b)); return ok([{ title: "Define Sets", body: `A = <span class="hl">${fmtSet(a)}</span><br>B = <span class="hl">${fmtSet(b)}</span>` }, { title: "Combine all elements from A and B", body: a.concat(b).join(", ") }, { title: "Remove duplicates — each element appears once", body: u.map((x) => `<span class="hl">${x}</span>`).join(", ") }, { title: "Final Union", body: `A &#8746; B = <span class="rv">${fmtSet(u)}</span>` }], `A &#8746; B = ${fmtSet(u)}`); };
    const solveSetInter = (aStr, bStr) => { const a = parseSet(aStr), b = parseSet(bStr); if (!a.length || !b.length) return err("Enter values for both sets."); const inter = a.filter((x) => b.indexOf(x) !== -1); const log = a.map((x) => `<span class="hl">${x}</span> in B? <span class="${b.indexOf(x) !== -1 ? "rv" : "op"}">${b.indexOf(x) !== -1 ? "Yes &#10003;" : "No &#10007;"}</span>`).join("<br>"); return ok([{ title: "Define Sets", body: `A = <span class="hl">${fmtSet(a)}</span><br>B = <span class="hl">${fmtSet(b)}</span>` }, { title: "Check each element of A — is it also in B?", body: log }, { title: "Collect matching elements", body: inter.length ? inter.map((x) => `<span class="rv">${x}</span>`).join(", ") : '<span class="op">No common elements — A &#8745; B = &#8709;</span>' }], `A &#8745; B = ${fmtSet(inter)}`); };
    const solveSetDiff = (aStr, bStr) => { const a = parseSet(aStr), b = parseSet(bStr); if (!a.length || !b.length) return err("Enter values for both sets."); const diff = a.filter((x) => b.indexOf(x) === -1); const log = a.map((x) => { const nin = b.indexOf(x) === -1; return `<span class="hl">${x}</span> in B? <span class="${nin ? "rv" : "op"}">${nin ? "No &#10003; Keep" : "Yes &#10007; Remove"}</span>`; }).join("<br>"); return ok([{ title: "Define Sets", body: `A = <span class="hl">${fmtSet(a)}</span><br>B = <span class="hl">${fmtSet(b)}</span>` }, { title: "A &#8722; B = elements in A that are NOT in B", body: log }, { title: "Result", body: diff.length ? diff.map((x) => `<span class="rv">${x}</span>`).join(", ") : '<span class="op">&#8709; (empty set)</span>' }], `A &#8722; B = ${fmtSet(diff)}`); };
    const solveSetComp = (uStr, aStr) => { const u = parseSet(uStr), a = parseSet(aStr); if (!u.length || !a.length) return err("Enter both sets."); const notInU = a.filter((x) => u.indexOf(x) === -1); if (notInU.length) return err("A must be a subset of U. Not in U: " + notInU.join(", ")); const comp = u.filter((x) => a.indexOf(x) === -1); const log = u.map((x) => { const nin = a.indexOf(x) === -1; return `<span class="hl">${x}</span> in A? <span class="${nin ? "rv" : "op"}">${nin ? "No &#10003; Include" : "Yes &#10007; Exclude"}</span>`; }).join("<br>"); return ok([{ title: "Universal Set U", body: `U = <span class="hl">${fmtSet(u)}</span>` }, { title: "Set A", body: `A = <span class="hl">${fmtSet(a)}</span>` }, { title: "A' = elements in U NOT in A", body: log }, { title: "Result", body: `A' = <span class="rv">${fmtSet(comp)}</span>` }], `A' = ${fmtSet(comp)}`); };
    const solveSubset = (aStr, bStr) => { const a = parseSet(aStr), b = parseSet(bStr); if (!a.length || !b.length) return err("Enter values for both sets."); const isSub = a.every((x) => b.indexOf(x) !== -1); const log = a.map((x) => { const inB = b.indexOf(x) !== -1; return `<span class="hl">${x}</span> in B? <span class="${inB ? "rv" : "op"}">${inB ? "Yes &#10003;" : "No &#10007; — NOT a subset"}</span>`; }).join("<br>"); return ok([{ title: "Define Sets", body: `A = <span class="hl">${fmtSet(a)}</span><br>B = <span class="hl">${fmtSet(b)}</span>` }, { title: "A &#8838; B means every element of A must be in B", body: log }, { title: "Conclusion", body: isSub ? '<span class="rv">A &#8838; B is TRUE &#10003;</span>' : '<span class="op">A &#8838; B is FALSE &#10007;</span>' }], isSub ? "TRUE — A &#8838; B" : "FALSE — A &#8838; B does not hold"); };

    const evalLogic = (expr, p, q) => { let e = expr.toUpperCase(); e = e.replace(/\(([^)]+)\)\s*IMPLIES\s*\(([^)]+)\)/g, (m, a, b) => "(!(" + a + ")||(" + b + "))"); e = e.replace(/([A-Z0-9]+)\s*IMPLIES\s*([A-Z0-9]+)/g, (m, a, b) => "(!(" + a + ")||(" + b + "))"); e = e.replace(/\bXOR\b/g, "!=="); e = e.replace(/\bAND\b/g, "&&"); e = e.replace(/\bOR\b/g, "||"); e = e.replace(/\bNOT\b/g, "!"); e = e.replace(/\bP\b/g, p ? "true" : "false"); e = e.replace(/\bQ\b/g, q ? "true" : "false"); try { return eval(e); } catch { return null; } };
    const solveLogicEval = (p, q, expr) => { expr = expr.trim(); if (!expr) return err("Enter an expression."); const result = evalLogic(expr, p, q); if (result === null) return err("Invalid expression. Use P, Q, AND, OR, NOT, IMPLIES, XOR."); const sub = expr.toUpperCase().replace(/\bP\b/g, `<span class="op">${p ? "T" : "F"}</span>`).replace(/\bQ\b/g, `<span class="op">${q ? "T" : "F"}</span>`); return ok([{ title: "Assigned Values", body: `P = <span class="hl">${p ? "True" : "False"}</span> &nbsp;&nbsp; Q = <span class="hl">${q ? "True" : "False"}</span>` }, { title: "Expression", body: `<span class="hl">${expr}</span>` }, { title: "Substitute values", body: sub }, { title: "Evaluate", body: `Result = <span class="rv">${result ? "True" : "False"}</span>` }], result ? "TRUE" : "FALSE"); };
    const solveTruthTable = (expr) => { expr = expr.trim(); if (!expr) return err("Enter an expression."); const combos = [[true, true], [true, false], [false, true], [false, false]]; const rows = combos.map((c) => ({ p: c[0], q: c[1], r: evalLogic(expr, c[0], c[1]) })); let tbl = '<table style="border-collapse:collapse;font-family:JetBrains Mono,monospace;font-size:0.88rem;width:100%;"><thead><tr style="background:rgba(0,82,255,0.06);">'; tbl += '<th style="padding:10px 16px;text-align:center;border:1px solid #e2e8f0;color:#0052ff;">P</th><th style="padding:10px 16px;text-align:center;border:1px solid #e2e8f0;color:#0052ff;">Q</th>'; tbl += `<th style="padding:10px 16px;text-align:center;border:1px solid #e2e8f0;color:#0052ff;">${expr}</th></tr></thead><tbody>`; rows.forEach((row, i) => { tbl += `<tr style="background:${i % 2 === 0 ? "rgba(15,23,42,0.02)" : "transparent"}">`; tbl += `<td style="padding:9px 16px;text-align:center;border:1px solid #e2e8f0;color:${row.p ? "#00b89c" : "#ef4444"}">${row.p ? "T" : "F"}</td>`; tbl += `<td style="padding:9px 16px;text-align:center;border:1px solid #e2e8f0;color:${row.q ? "#00b89c" : "#ef4444"}">${row.q ? "T" : "F"}</td>`; tbl += `<td style="padding:9px 16px;text-align:center;border:1px solid #e2e8f0;color:${row.r ? "#00b89c" : "#ef4444"};font-weight:700;">${row.r === null ? "ERR" : row.r ? "T" : "F"}</td></tr>`; }); tbl += "</tbody></table>"; return { tableHtml: tbl }; };

    const isBin = (s) => /^[01]+$/.test(s.trim());
    const solveBinAdd = (a, b) => { a = a.trim(); b = b.trim(); if (!isBin(a) || !isBin(b)) return err("Enter valid binary numbers (0s and 1s only)."); const da = parseInt(a, 2), db = parseInt(b, 2), dr = da + db; const rb = dr.toString(2); const maxl = Math.max(a.length, b.length) + 1; const ap = a.padStart(maxl, "0"), bp = b.padStart(maxl, "0"); let carry = 0, colLog = ""; for (let i = maxl - 1; i >= 0; i--) { const ba = parseInt(ap[i]), bb = parseInt(bp[i]); const s = ba + bb + carry; const bit = s % 2, nc = Math.floor(s / 2); colLog += `Column ${maxl - i}: <span class="hl">${ba}</span> + <span class="hl">${bb}</span> + carry(<span class="op">${carry}</span>) = ${s} &#8594; bit=<span class="rv">${bit}</span>, next carry=<span class="op">${nc}</span><br>`; carry = nc; } return ok([{ title: "Given binary numbers", body: `A = <span class="hl">${a}</span>&#8322; = ${da}&#8321;&#8320;<br>B = <span class="hl">${b}</span>&#8322; = ${db}&#8321;&#8320;` }, { title: "Pad to equal length", body: `A = <span class="hl">${ap}</span><br>B = <span class="hl">${bp}</span>` }, { title: "Add column by column right to left (track carry)", body: colLog }, { title: "Result", body: `Sum = <span class="rv">${rb}</span>&#8322;` }, { title: "Decimal verification", body: `${da} + ${db} = <span class="rv">${dr}</span>&#8321;&#8320; &#10003;` }], `${rb}&#8322; = ${dr}&#8321;&#8320;`); };
    const solveBinSub = (a, b) => { a = a.trim(); b = b.trim(); if (!isBin(a) || !isBin(b)) return err("Enter valid binary numbers."); const da = parseInt(a, 2), db = parseInt(b, 2); if (db > da) return err("A must be >= B for this method."); const dr = da - db, rb = dr.toString(2); const len = Math.max(a.length, b.length) + 1; const oc = b.padStart(len, "0").split("").map((x) => (x === "0" ? "1" : "0")).join(""); const tc = (parseInt(oc, 2) + 1).toString(2).padStart(len, "0"); return ok([{ title: "Given", body: `A = <span class="hl">${a}</span>&#8322; (${da}&#8321;&#8320;) &nbsp; B = <span class="hl">${b}</span>&#8322; (${db}&#8321;&#8320;)` }, { title: "Step 1 — Find 1's complement of B (flip all bits)", body: `B padded = <span class="hl">${b.padStart(len, "0")}</span><br>1's complement = <span class="hl">${oc}</span>` }, { title: "Step 2 — Find 2's complement (add 1)", body: `1's complement + 1 = <span class="hl">${oc}</span> + 1 = <span class="rv">${tc}</span>` }, { title: "Step 3 — Add A and 2's complement of B", body: `<span class="hl">${a.padStart(len, "0")}</span><br>+ <span class="hl">${tc}</span><br>= <span class="rv">${(da + parseInt(tc, 2)).toString(2)}</span>` }, { title: "Step 4 — Drop overflow carry bit", body: `Result = <span class="rv">${rb}</span>&#8322;` }, { title: "Decimal verification", body: `${da} &#8722; ${db} = <span class="rv">${dr}</span>&#8321;&#8320; &#10003;` }], `${rb}&#8322; = ${dr}&#8321;&#8320;`); };

    function LogicSolver() {

    function MatrixGrid({ matrix, onChange, label }) { return <div className="mb-4"><p className="mb-2 font-mono text-xs font-bold uppercase tracking-wide text-primary">{label}</p><div className="inline-grid gap-1.5" style={{ gridTemplateColumns: `repeat(${matrix[0].length}, 64px)` }}>{matrix.map((row, i) => row.map((val, j) => <input key={`${i}-${j}`} type="number" value={val} onChange={(e) => { const next = matrix.map((r) => r.slice()); next[i][j] = parseFloat(e.target.value) || 0; onChange(next); }} className="rounded-lg border border-input bg-secondary/50 px-2 py-2 text-center font-mono text-sm outline-none focus:border-primary focus:bg-card" />))}</div></div>; }
    function MatrixSolver() {
      const [tab, setTab] = useState("madd"); const [res, setRes] = useState(null);
      const makeMatrix = (r, c, val = 0) => Array.from({ length: r }, () => Array.from({ length: c }, () => val));
      const [addR, setAddR] = useState(2); const [addC, setAddC] = useState(2); const [matA, setMatA] = useState(makeMatrix(2, 2)); const [matB, setMatB] = useState(makeMatrix(2, 2));
      const [mulM, setMulM] = useState(2); const [mulN, setMulN] = useState(2); const [mulP, setMulP] = useState(2); const [mulA, setMulA] = useState(makeMatrix(2, 2)); const [mulB, setMulB] = useState(makeMatrix(2, 2));
      const [detSize, setDetSize] = useState(2); const [detA, setDetA] = useState(makeMatrix(2, 2));

lassName="mb-4 flex gap-3">{sizeField("Rows", transR, setTransR)}{sizeField("Cols", transC, setTransC)}</div><MatrixGrid matrix={transA} onChange={setTransA} label={`Matrix A (${transR}×${transC})`} /><SolveButton onClick={run}>Transpose →</SolveButton></InputSection>}<ResultPanel result={res} /></div></div>;

    function PrimeSolver() {
      const [tab, setTab] = useState("ptest"); const [res, setRes] = useState(null); const [n, setN] = useState(""); const [from, setFrom] = useState(1); const [to, setTo] = useState(50);
      const run = () => { if (tab === "ptest") setRes(solvePrimeTest(n)); else if (tab === "plist") setRes(solvePrimeList(from, to)); else if (tab === "pfact") setRes(solvePrimeFact(n)); };

      const tabs = [{ id: "dpower", label: "Power Rule" }, { id: "dchain", label: "Chain Rule" }, { id: "dtrig", label: "Trig / Exp / Log" }];
      return <div><div className="px-6 pt-10 md:px-10"><BackButton to="/math" label="← Back to Mathematics" /></div><div className="px-6 pb-8 md:px-10"><h2 className="font-heading text-3xl font-bold tracking-tight md:text-4xl">Derivatives</h2><p className="mt-2 text-sm text-muted-foreground md:text-base">Find derivatives of common function types step by step</p></div><TabBar tabs={tabs} active={tab} onChange={(t) => { setTab(t); setRes(null); }} /><div className="mx-auto max-w-3xl px-6 py-8 md:px-10">{tab === "dpower" && <><InfoBox><strong className="text-primary">Power Rule:</strong> d/dx [axⁿ] = n·a·xⁿ⁻¹<br />Enter a polynomial as a sum of terms, e.g. <strong className="text-primary">3x^4 + 2x^2 - 5x + 7</strong></InfoBox><InputSection heading="Differentiate Polynomial"><Field label="f(x)" className="min-w-[320px]"><input className={inputClass} value={fx} onChange={(e) => setFx(e.target.value)} /></Field><SolveButton onClick={run}>Differentiate →</SolveButton></InputSection></>}{tab === "dchain" && <><InfoBox><strong className="text-primary">Chain Rule:</strong> d/dx [f(g(x))] = f'(g(x)) · g'(x)<br />Outer function choices: xⁿ, sin, cos, eˣ, ln · Inner g(x) = ax^n</InfoBox><InputSection heading="Outer f applied to Inner g(x) = ax^n"><div className="flex flex-wrap gap-3"><Field label="Outer function f"><select className={inputClass} value={outer} onChange={(e) => setOuter(e.target.value)}><option value="pow">Power: (...)^p</option><option value="sin">sin(...)</option><option value="cos">cos(...)</option><option value="exp">e^(...)</option><option value="ln">ln(...)</option></select></Field>{outer === "pow" && <Field label="Outer power p"><input type="number" className={inputClass} value={p} onChange={(e) => setP(e.target.value)} /></Field>}</div><div className="mt-3 flex flex-wrap gap-3"><Field label="Inner g(x) — coefficient a"><input type="number" className={inputClass} value={a} onChange={(e) => setA(e.target.value)} /></Field><Field label="Inner g(x) — power n"><input type="number" className={inputClass} value={n} onChange={(e) => setN(e.target.value)} /></Field></div><SolveButton onClick={run}>Apply Chain Rule →</SolveButton></InputSection></>}{tab === "dtrig" && <><InfoBox><strong className="text-primary">Standard Derivatives:</strong> d/dx[sin x]=cos x · d/dx[cos x]=−sin x · d/dx[tan x]=sec²x · d/dx[eˣ]=eˣ · d/dx[aˣ]=aˣln(a) · d/dx[ln x]=1/x</InfoBox><InputSection heading="Find derivative of standard function"><div className="flex flex-wrap gap-3"><Field label="Function type"><select className={inputClass} value={trigType} onChange={(e) => setTrigType(e.target.value)}><option value="sin">sin(x)</option><option value="cos">cos(x)</option><option value="tan">tan(x)</option><option value="ex">eˣ</option><option value="ax">aˣ (specify a)</option><option value="lnx">ln(x)</option><option value="loga">log_a(x) (specify a)</option></select></Field><Field label="Base a (for aˣ or log_a)"><input type="number" min="0.001" className={inputClass} value={trigA} onChange={(e) => setTrigA(e.target.value)} /></Field></div><SolveButton onClick={run}>Find Derivative →</SolveButton></InputSection></>}<ResultPanel result={res} /></div></div>;
    }

    function IntegSolver() {
      const [tab, setTab] = useState("indef"); const [res, setRes] = useState(null); const [fxIndef, setFxIndef] = useState("4x^3 + 2x - 6"); const [fxDef, setFxDef] = useState("3x^2 + 2x"); const [limA, setLimA] = useState(0); const [limB, setLimB] = useState(3); const [trigType, setTrigType] = useState("sinx"); const [trigA, setTrigA] = useState(2);
      const run = () => { if (tab === "indef") setRes(solveIndef(fxIndef)); else if (tab === "defin") setRes(solveDefin(fxDef, limA, limB)); else if (tab === "itrig") setRes(solveTrigInteg(trigType, trigA)); };
      const tabs = [{ id: "indef", label: "Indefinite" }, { id: "defin", label: "Definite" }, { id: "itrig", label: "Trig / Exp / Log" }];
      return <div><div className="px-6 pt-10 md:px-10"><BackButton to="/math" label="← Back to Mathematics" /></div><div className="px-6 pb-8 md:px-10"><h2 className="font-heading text-3xl font-bold tracking-tight md:text-4xl">Integrals</h2><p className="mt-2 text-sm text-muted-foreground md:text-base">Compute indefinite and definite integrals step by step</p></div><TabBar tabs={tabs} active={tab} onChange={(t) => { setTab(t); setRes(null); }} /><div className="mx-auto max-w-3xl px-6 py-8 md:px-10">{tab === "indef" && <><InfoBox><strong className="text-primary">Power Rule of Integration:</strong> ∫axⁿ dx = (a/(n+1))xⁿ⁺¹ + C &nbsp; (n ≠ −1)<br />Enter a polynomial e.g. <strong className="text-primary">4x^3 + 2x - 6</strong></InfoBox><InputSection heading="∫ f(x) dx — Indefinite Integral"><Field label="f(x)" className="min-w-[320px]"><input className={inputClass} value={fxIndef} onChange={(e) => setFxIndef(e.target.value)} /></Field><SolveButton onClick={run}>Integrate →</SolveButton></InputSection></>}{tab === "defin" && <><InfoBox><strong className="text-primary">Definite Integral:</strong> ∫ₐᵇ f(x) dx = F(b) − F(a) where F is the antiderivative<br />Enter a polynomial e.g. <strong className="text-primary">3x^2 + 2x</strong></InfoBox><InputSection heading="∫ₐᵇ f(x) dx — Definite Integral"><Field label="f(x)" className="min-w-[320px]"><input className={inputClass} value={fxDef} onChange={(e) => setFxDef(e.target.value)} /></Field><div className="mt-3 flex flex-wrap gap-3"><Field label="Lower limit a"><input type="number" className={inputClass} value={limA} onChange={(e) => setLimA(e.target.value)} /></Field><Field label="Upper limit b"><input type="number" className={inputClass} value={limB} onChange={(e) => setLimB(e.target.value)} /></Field></div><SolveButton onClick={run}>Evaluate →</SolveButton></InputSection></>}{tab === "itrig" && <><InfoBox><strong className="text-primary">Standard Integrals:</strong> ∫sin x dx=−cos x+C · ∫cos x dx=sin x+C · ∫eˣ dx=eˣ+C · ∫(1/x)dx=ln|x|+C · ∫aˣdx=aˣ/ln(a)+C</InfoBox><InputSection heading="Standard function integration"><div className="flex flex-wrap gap-3"><Field label="Function type"><select className={inputClass} value={trigType} onChange={(e) => setTrigType(e.target.value)}><option value="sinx">sin(x)</option><option value="cosx">cos(x)</option><option value="ex">eˣ</option><option value="invx">1/x</option><option value="ax">aˣ (specify a)</option><option value="tanx">tan(x)</option></select></Field><Field label="Base a (for aˣ)"><input type="number" min="0.001" className={inputClass} value={trigA} onChange={(e) => setTrigA(e.target.value)} /></Field></div><SolveButton onClick={run}>Integrate →</SolveButton></InputSection></>}<ResultPanel result={res} /></div></div>;
    }

    function SeqSolver() {
      const [tab, setTab] = useState("sarith"); const [res, setRes] = useState(null); const [a1, setA1] = useState(2); const [d, setD] = useState(3); const [n, setN] = useState(10); const [ga1, setGA1] = useState(3); const [r, setR] = useState(2); const [gn, setGN] = useState(6);
      const run = () => { if (tab === "sarith") setRes(solveArithSeq(a1, d, n)); else setRes(solveGeoSeq(ga1, r, gn)); };
      const tabs = [{ id: "sarith", label: "Arithmetic" }, { id: "sgeo", label: "Geometric" }];
      return <div><div className="px-6 pt-10 md:px-10"><BackButton to="/math" label="← Back to Mathematics" /></div><div className="px-6 pb-8 md:px-10"><h2 className="font-heading text-3xl font-bold tracking-tight md:text-4xl">Sequences</h2><p className="mt-2 text-sm text-muted-foreground md:text-base">Find the nth term and partial sums of arithmetic and geometric sequences</p></div><TabBar tabs={tabs} active={tab} onChange={(t) => { setTab(t); setRes(null); }} /><div className="mx-auto max-w-3xl px-6 py-8 md:px-10">{tab === "sarith" && <><InfoBox><strong className="text-primary">Arithmetic Sequence:</strong> aₙ = a₁ + (n−1)·d &nbsp;|&nbsp; Sₙ = n/2 · (2a₁ + (n−1)d)</InfoBox><InputSection heading="Arithmetic Sequence"><div className="flex flex-wrap gap-3"><Field label="First term a₁"><input type="number" className={inputClass} value={a1} onChange={(e) => setA1(e.target.value)} /></Field><Field label="Common difference d"><input type="number" className={inputClass} value={d} onChange={(e) => setD(e.target.value)} /></Field><Field label="Find nth term (n)"><input type="number" min="1" className={inputClass} value={n} onChange={(e) => setN(e.target.value)} /></Field></div><SolveButton onClick={run}>Solve →</SolveButton></InputSection></>}{tab === "sgeo" && <><InfoBox><strong className="text-primary">Geometric Sequence:</strong> aₙ = a₁ · rⁿ⁻¹ &nbsp;|&nbsp; Sₙ = a₁·(1−rⁿ)/(1−r) for r≠1</InfoBox><InputSection heading="Geometric Sequence"><div className="flex flex-wrap gap-3"><Field label="First term a₁"><input type="number" className={inputClass} value={ga1} onChange={(e) => setGA1(e.target.value)} /></Field><Field label="Common ratio r"><input type="number" step="any" className={inputClass} value={r} onChange={(e) => setR(e.target.value)} /></Field><Field label="Find nth term (n)"><input type="number" min="1" className={inputClass} value={gn} onChange={(e) => setGN(e.target.value)} /></Field></div><SolveButton onClick={run}>Solve →</SolveButton></InputSection></>}<ResultPanel result={res} /></div></div>;
    }

    function SeriesSolver() {
      const [res, setRes] = useState(null); const [a1, setA1] = useState(6); const [r, setR] = useState(0.5);
      return <div><div className="px-6 pt-10 md:px-10"><BackButton to="/math" label="← Back to Mathematics" /></div><div className="px-6 pb-8 md:px-10"><h2 className="font-heading text-3xl font-bold tracking-tight md:text-4xl">Series</h2><p className="mt-2 text-sm text-muted-foreground md:text-base">Test convergence and calculate sums of infinite geometric series</p></div><div className="mx-auto max-w-3xl px-6 py-8 md:px-10"><InfoBox><strong className="text-primary">Infinite Geometric Series:</strong> S∞ = a₁ / (1−r) &nbsp; only if |r| &lt; 1 (converges)<br />If |r| ≥ 1 the series diverges (no finite sum)</InfoBox><InputSection heading="Sum of Infinite Geometric Series"><div className="flex flex-wrap gap-3"><Field label="First term a₁"><input type="number" className={inputClass} value={a1} onChange={(e) => setA1(e.target.value)} /></Field><Field label="Common ratio r"><input type="number" step="any" className={inputClass} value={r} onChange={(e) => setR(e.target.value)} /></Field></div><SolveButton onClick={() => setRes(solveInfSeries(a1, r))}>Test &amp; Calculate →</SolveButton></InputSection><ResultPanel result={res} /></div></div>;
    }

    const solverMap = { set: SetSolver, logic: LogicSolver, binary: BinarySolver, matrix: MatrixSolver, prime: PrimeSolver, deriv: DerivSolver, integ: IntegSolver, seq: SeqSolver, series: SeriesSolver };
    function Solver() { const { subject } = useParams(); const Component = solverMap[subject]; if (!Component) return <Navigate to="/math" replace />; return <Component />; }

    function PageNotFound() { return <div className="flex min-h-screen flex-col items-center justify-center px-6 text-center"><h1 className="font-heading text-6xl font-bold text-foreground">404</h1><p className="mt-4 text-muted-foreground">This page could not be found.</p><Link to="/" className="mt-6 inline-flex items-center gap-2 rounded-xl bg-primary px-6 py-3 font-heading text-sm font-semibold text-white shadow-glow">← Back to Dashboard</Link></div>; }

    function App() {
      return <Router><ScrollToTop /><Routes><Route element={<Layout />}><Route path="/" element={<Dashboard />} /><Route path="/math" element={<MathHub />} /><Route path="/logic-design" element={<LogicDesign />} /><Route path="/logic-design/:topic" element={<LogicDesignSolver />} /><Route path="/team" element={<Team />} /><Route path="/about" element={<About />} /><Route path="/contact" element={<Contact />} /><Route path="/solver/:subject" element={<Solver />} /></Route><Route path="*" element={<PageNotFound />} /></Routes></Router>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
