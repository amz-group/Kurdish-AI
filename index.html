<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QRForge — a digital gateway command center. Generate, customize, analyze and vault professional QR codes with structural clarity." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>QRForge — Digital Gateway Command Center</title>

    <style>
      :root {
        --background: 210 17% 98%;
        --foreground: 240 2% 10%;
        --card: 0 0% 100%;
        --card-foreground: 240 2% 10%;
        --popover: 0 0% 100%;
        --popover-foreground: 240 2% 10%;
        --primary: 240 2% 10%;
        --primary-foreground: 210 17% 98%;
        --secondary: 210 17% 96%;
        --secondary-foreground: 240 2% 10%;
        --muted: 210 17% 96%;
        --muted-foreground: 240 4% 42%;
        --accent: 158 100% 45%;
        --accent-foreground: 240 2% 10%;
        --destructive: 0 84% 60%;
        --destructive-foreground: 0 0% 98%;
        --border: 214 29% 91%;
        --input: 214 29% 91%;
        --ring: 240 2% 10%;
        --chart-1: 158 100% 45%;
        --chart-2: 240 2% 40%;
        --chart-3: 214 29% 70%;
        --chart-4: 30 80% 55%;
        --chart-5: 340 75% 55%;
        --radius: 0.75rem;
        --font-heading: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        --font-body: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-display: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .dark {
        --background: 240 5% 7%;
        --foreground: 210 17% 98%;
        --card: 240 5% 9%;
        --card-foreground: 210 17% 98%;
        --popover: 240 5% 9%;
        --popover-foreground: 210 17% 98%;
        --primary: 210 17% 98%;
        --primary-foreground: 240 2% 10%;
        --secondary: 240 5% 14%;
        --secondary-foreground: 210 17% 98%;
        --muted: 240 5% 14%;
        --muted-foreground: 210 10% 60%;
        --accent: 158 100% 45%;
        --accent-foreground: 240 5% 7%;
        --destructive: 0 62% 40%;
        --destructive-foreground: 210 17% 98%;
        --border: 240 5% 18%;
        --input: 240 5% 18%;
        --ring: 210 17% 70%;
      }
      * { border-color: hsl(var(--border)); outline-color: hsl(var(--ring) / 0.5); }
      body {
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: var(--font-body);
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::selection { background-color: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
      .micro-grid {
        background-image:
          linear-gradient(to right, hsl(var(--border) / 0.5) 1px, transparent 1px),
          linear-gradient(to bottom, hsl(var(--border) / 0.5) 1px, transparent 1px);
        background-size: 32px 32px;
      }
      .glass-isolate {
        background: hsl(var(--card) / 0.7);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
      }
      html { scroll-behavior: smooth; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            opacity: Object.fromEntries(Array.from({ length: 101 }, function (_, i) { return [i, (i / 100).toString()]; })),
            borderRadius: {
              lg: 'var(--radius)',
              md: 'calc(var(--radius) - 2px)',
              sm: 'calc(var(--radius) - 4px)'
            },
            colors: {
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
              popover: { DEFAULT: 'hsl(var(--popover))', foreground: 'hsl(var(--popover-foreground))' },
              primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
              secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
              muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
              accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
              destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
              border: 'hsl(var(--border))',
              input: 'hsl(var(--input))',
              ring: 'hsl(var(--ring))',
              chart: {
                '1': 'hsl(var(--chart-1))',
                '2': 'hsl(var(--chart-2))',
                '3': 'hsl(var(--chart-3))',
                '4': 'hsl(var(--chart-4))',
                '5': 'hsl(var(--chart-5))'
              },
              sidebar: {
                DEFAULT: 'hsl(var(--sidebar-background))',
                foreground: 'hsl(var(--sidebar-foreground))',
                primary: 'hsl(var(--sidebar-primary))',
                'primary-foreground': 'hsl(var(--sidebar-primary-foreground))',
                accent: 'hsl(var(--sidebar-accent))',
                'accent-foreground': 'hsl(var(--sidebar-accent-foreground))',
                border: 'hsl(var(--sidebar-border))',
                ring: 'hsl(var(--sidebar-ring))'
              }
            },
            fontFamily: {
              heading: ['var(--font-heading)'],
              body: ['var(--font-body)'],
              display: ['var(--font-display)'],
              mono: ['var(--font-mono)']
            },
            keyframes: {
              'accordion-down': { from: { height: '0' }, to: { height: 'var(--radix-accordion-content-height)' } },
              'accordion-up': { from: { height: 'var(--radix-accordion-content-height)' }, to: { height: '0' } },
              'pulse-mint': { '0%': { transform: 'scale(0.4)', opacity: '0.9' }, '100%': { transform: 'scale(2.4)', opacity: '0' } }
            },
            animation: {
              'accordion-down': 'accordion-down 0.2s ease-out',
              'accordion-up': 'accordion-up 0.2s ease-out',
              'pulse-mint': 'pulse-mint 2.4s ease-out infinite'
            }
          }
        }
      };
    </script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0?external=react",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?external=react",
        "framer-motion": "https://esm.sh/framer-motion@11.16.4?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react",
        "qrcode.react": "https://esm.sh/qrcode.react@4.2.0?external=react"
      }
    }
    </script>

    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
      import React, { useState, useEffect, useRef } from "react";
      import { createRoot } from "react-dom/client";
      import { motion, AnimatePresence } from "framer-motion";
      import {
        Menu, X, QrCode, Download, ScanLine, Save, Clipboard, Link2,
        Square, Circle, Frame, Palette, ShieldCheck, Sliders,
        Activity, MapPin, TrendingUp,
        Trash2, Plus, CheckSquare, Database,
        Github, Twitter, Linkedin, CreditCard, Store
      } from "lucide-react";
      import { QRCodeCanvas } from "qrcode.react";

      /* ============== LiveBackground ============== */
      const COLS = 26;
      const ROWS = 16;
      const cells = Array.from({ length: COLS * ROWS }).map((_, i) => ({
        i,
        on: Math.random() > 0.74,
        delay: Math.random() * 6,
        dur: 3 + Math.random() * 4,
      }));
      const particles = Array.from({ length: 18 }).map((_, i) => ({
        id: i,
        x: Math.random() * 100,
        y: Math.random() * 100,
        size: 1.5 + Math.random() * 3,
        delay: Math.random() * 8,
        dur: 9 + Math.random() * 10,
        dx: (Math.random() - 0.5) * 40,
        dy: (Math.random() - 0.5) * 40,
      }));

      function LiveBackground() {
        return (
          <div className="fixed inset-0 -z-10 overflow-hidden bg-background pointer-events-none">
            <motion.div
              className="absolute -top-40 -left-32 w-[42vw] h-[42vw] rounded-full blur-[120px]"
              style={{ background: "radial-gradient(circle, hsl(158 100% 45% / 0.22), transparent 70%)" }}
              animate={{ x: [0, 80, -40, 0], y: [0, 50, 90, 0], scale: [1, 1.15, 0.95, 1] }}
              transition={{ duration: 26, repeat: Infinity, ease: "easeInOut" }}
            />
            <motion.div
              className="absolute top-1/3 -right-40 w-[38vw] h-[38vw] rounded-full blur-[120px]"
              style={{ background: "radial-gradient(circle, hsl(210 40% 60% / 0.18), transparent 70%)" }}
              animate={{ x: [0, -70, 30, 0], y: [0, 60, -30, 0], scale: [1, 0.9, 1.2, 1] }}
              transition={{ duration: 32, repeat: Infinity, ease: "easeInOut" }}
            />
            <motion.div
              className="absolute bottom-[-20%] left-1/4 w-[46vw] h-[46vw] rounded-full blur-[140px]"
              style={{ background: "radial-gradient(circle, hsl(190 80% 50% / 0.14), transparent 70%)" }}
              animate={{ x: [0, 60, -60, 0], y: [0, -40, 40, 0], scale: [1, 1.1, 0.9, 1] }}
              transition={{ duration: 38, repeat: Infinity, ease: "easeInOut" }}
            />
            <div
              className="absolute inset-0 grid"
              style={{
                gridTemplateColumns: "repeat(" + COLS + ",1fr)",
                gridTemplateRows: "repeat(" + ROWS + ",1fr)",
                gap: "4px",
                padding: "0",
                maskImage: "radial-gradient(ellipse 80% 80% at 50% 40%, black 55%, transparent 100%)",
                WebkitMaskImage: "radial-gradient(ellipse 80% 80% at 50% 40%, black 55%, transparent 100%)",
              }}
            >
              {cells.map((c) => (
                <motion.span
                  key={c.i}
                  className="rounded-[2px]"
                  style={{ background: c.on ? "hsl(158 100% 45%)" : "hsl(214 29% 86%)" }}
                  initial={{ opacity: c.on ? 0.15 : 0.06 }}
                  animate={{ opacity: c.on ? [0.15, 0.85, 0.15] : [0.06, 0.16, 0.06], scale: c.on ? [0.7, 1, 0.7] : 1 }}
                  transition={{ duration: c.dur, delay: c.delay, repeat: Infinity, ease: "easeInOut" }}
                />
              ))}
            </div>
            {particles.map((p) => (
              <motion.span
                key={p.id}
                className="absolute rounded-full"
                style={{
                  left: p.x + "%",
                  top: p.y + "%",
                  width: p.size,
                  height: p.size,
                  background: "hsl(158 100% 45%)",
                  boxShadow: "0 0 10px hsl(158 100% 45% / 0.8)",
                }}
                animate={{ x: [0, p.dx, 0], y: [0, p.dy, 0], opacity: [0, 0.9, 0] }}
                transition={{ duration: p.dur, delay: p.delay, repeat: Infinity, ease: "easeInOut" }}
              />
            ))}
            <motion.div
              className="absolute inset-y-0 w-[40%]"
              style={{ background: "linear-gradient(90deg, transparent, hsl(158 100% 45% / 0.06), transparent)" }}
              animate={{ x: ["-40%", "140%"] }}
              transition={{ duration: 14, repeat: Infinity, ease: "linear" }}
            />
            <div className="absolute inset-0 micro-grid opacity-[0.35]" />
            <div
              className="absolute inset-0"
              style={{ background: "radial-gradient(ellipse 60% 50% at 50% 10%, transparent, hsl(210 17% 98% / 0.5))" }}
            />
          </div>
        );
      }

      /* ============== GhostNav ============== */
      const navLinks = [
        { id: "generate", label: "01_GENERATE" },
        { id: "studio", label: "02_STUDIO" },
        { id: "analyze", label: "03_ANALYZE" },
        { id: "vault", label: "04_VAULT" },
      ];

      function GhostNav() {
        const [scrolled, setScrolled] = useState(false);
        const [open, setOpen] = useState(false);

        useEffect(() => {
          const onScroll = () => setScrolled(window.scrollY > 24);
          window.addEventListener("scroll", onScroll);
          return () => window.removeEventListener("scroll", onScroll);
        }, []);

        return (
          <header className={"fixed top-0 inset-x-0 z-50 transition-all duration-500 " + (scrolled ? "glass-isolate border-b border-border" : "bg-transparent")}>
            <nav className="max-w-[1600px] mx-auto px-6 lg:px-10 h-16 flex items-center justify-between">
              <a href="#top" className="flex items-center gap-2.5 group">
                <span className="grid place-content-center w-8 h-8 rounded-md bg-primary text-primary-foreground">
                  <QrCode size={18} />
                </span>
                <span className="font-heading font-extrabold tracking-tight text-[15px]">
                  QR<span className="text-accent">FORGE</span>
                </span>
              </a>
              <div className="hidden md:flex items-center gap-9">
                {navLinks.map((l) => (
                  <a key={l.id} href={"#" + l.id} className="font-mono text-[11px] tracking-[0.14em] text-muted-foreground hover:text-foreground transition-colors">
                    {l.label}
                  </a>
                ))}
                <a href="#generate" className="font-mono text-[11px] tracking-[0.14em] px-4 py-2 rounded-md bg-accent text-accent-foreground hover:opacity-90 transition-opacity">
                  LAUNCH →
                </a>
              </div>
              <button className="md:hidden p-2" onClick={() => setOpen((v) => !v)} aria-label="Toggle menu">
                {open ? <X size={20} /> : <Menu size={20} />}
              </button>
            </nav>
            {open && (
              <div className="md:hidden glass-isolate border-t border-border px-6 py-4 flex flex-col gap-3">
                {navLinks.map((l) => (
                  <a key={l.id} href={"#" + l.id} onClick={() => setOpen(false)} className="font-mono text-xs tracking-[0.14em] text-muted-foreground py-2">
                    {l.label}
                  </a>
                ))}
              </div>
            )}
          </header>
        );
      }

      /* ============== QrGenerator ============== */
      function QrGenerator({ config, setConfig, onSave, onOpenTest }) {
        const wrapRef = useRef(null);

        const handleDownload = () => {
          const canvas = wrapRef.current?.querySelector("canvas");
          if (!canvas) return;
          const url = canvas.toDataURL("image/png");
          const a = document.createElement("a");
          a.href = url;
          a.download = "qrforge-code.png";
          a.click();
          onOpenTest();
        };

        return (
          <section id="generate" className="relative pt-28 pb-24 lg:pt-36 lg:pb-32 overflow-hidden">
            <div className="absolute inset-0 micro-grid opacity-40 pointer-events-none" />
            <div className="max-w-[1600px] mx-auto px-6 lg:px-10 relative">
              <div className="mb-10 lg:mb-14 flex items-end justify-between flex-wrap gap-4">
                <div className="max-w-2xl">
                  <span className="font-mono text-[11px] tracking-[0.2em] text-accent">// INSTANT PORTAL</span>
                  <h1 className="mt-3 font-heading font-extrabold tracking-[-0.04em] text-[clamp(2.4rem,6vw,4.6rem)] leading-[0.95]">
                    Bridge the physical<br />
                    <span className="text-muted-foreground">to the digital.</span>
                  </h1>
                  <p className="mt-5 text-muted-foreground text-lg leading-relaxed max-w-xl">
                    Type a destination. Watch the lattice assemble in real time. Generate, customize, and deploy a scannable gateway in seconds.
                  </p>
                </div>
              </div>

              <div className="grid lg:grid-cols-5 gap-6 lg:gap-8 items-stretch">
                <div className="lg:col-span-3 glass-isolate rounded-xl border border-border p-6 lg:p-8 flex flex-col">
                  <label className="font-mono text-[10px] tracking-[0.2em] text-muted-foreground uppercase mb-3">
                    Target → URL / Text / vCard
                  </label>
                  <textarea
                    value={config.text}
                    onChange={(e) => setConfig((c) => ({ ...c, text: e.target.value }))}
                    placeholder="https://qrforge.io"
                    rows={4}
                    className="w-full resize-none bg-background font-mono text-[15px] text-foreground placeholder:text-muted-foreground/50 rounded-lg border border-border p-4 focus:border-accent focus:outline-none transition-colors"
                  />
                  <div className="mt-4 flex flex-wrap gap-2">
                    <button
                      onClick={async () => {
                        try {
                          const t = await navigator.clipboard.readText();
                          setConfig((c) => ({ ...c, text: t }));
                        } catch {}
                      }}
                      className="flex items-center gap-2 font-mono text-[11px] tracking-wider px-3 py-2 rounded-md border border-border hover:border-accent hover:text-accent transition-colors"
                    >
                      <Clipboard size={13} /> PASTE
                    </button>
                    <button
                      onClick={() => setConfig((c) => ({ ...c, text: "mailto:hello@qrforge.io" }))}
                      className="flex items-center gap-2 font-mono text-[11px] tracking-wider px-3 py-2 rounded-md border border-border hover:border-accent hover:text-accent transition-colors"
                    >
                      <Link2 size={13} /> USE MAILTO
                    </button>
                  </div>

                  <div className="mt-6 pt-6 border-t border-border grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <Stat k="MODULES" v={config.text ? "√ ACTIVE" : "∅ IDLE"} />
                    <Stat k="ECC" v={"LEVEL " + config.eccLevel} />
                    <Stat k="MARGIN" v={config.margin + "q"} />
                    <Stat k="SIZE" v={config.size + "px"} />
                  </div>
                </div>

                <div className="lg:col-span-2 relative">
                  <div className="glass-isolate rounded-xl border border-border p-6 lg:p-8 flex flex-col items-center justify-center min-h-[340px] relative overflow-hidden">
                    <div className="absolute top-4 left-4 font-mono text-[9px] tracking-[0.2em] text-muted-foreground">PREVIEW.PEDESTAL</div>
                    <div className="absolute top-4 right-4 font-mono text-[9px] tracking-[0.2em] text-accent">● LIVE</div>
                    <AnimatePresence mode="wait">
                      <motion.div
                        key={config.text + config.fgColor + config.bgColor + config.eccLevel + config.margin}
                        initial={{ opacity: 0, scale: 0.94 }}
                        animate={{ opacity: 1, scale: 1 }}
                        transition={{ duration: 0.35, ease: [0.22, 1, 0.36, 1] }}
                        className="bg-background rounded-lg p-4 shadow-[0_24px_60px_-20px_rgba(0,0,0,0.25)]"
                        ref={wrapRef}
                      >
                        <QRCodeCanvas
                          value={config.text || " "}
                          size={220}
                          level={config.eccLevel}
                          marginSize={config.margin}
                          fgColor={config.fgColor}
                          bgColor={config.bgColor}
                        />
                      </motion.div>
                    </AnimatePresence>
                    <p className="mt-5 font-mono text-[10px] tracking-[0.18em] text-muted-foreground text-center">
                      {config.text ? config.text.length + " CHARS ENCODED" : "AWAITING INPUT"}
                    </p>
                  </div>
                </div>
              </div>

              <div className="mt-6 flex flex-wrap gap-3">
                <button
                  onClick={handleDownload}
                  className="flex items-center gap-2 font-mono text-[12px] tracking-wider px-5 py-3 rounded-md bg-accent text-accent-foreground hover:opacity-90 transition-opacity"
                >
                  <Download size={15} /> DOWNLOAD .PNG
                </button>
                <button
                  onClick={onOpenTest}
                  className="flex items-center gap-2 font-mono text-[12px] tracking-wider px-5 py-3 rounded-md bg-primary text-primary-foreground hover:opacity-90 transition-opacity"
                >
                  <ScanLine size={15} /> SCAN-TO-TEST
                </button>
                <button
                  onClick={onSave}
                  className="flex items-center gap-2 font-mono text-[12px] tracking-wider px-5 py-3 rounded-md border border-border hover:border-accent hover:text-accent transition-colors"
                >
                  <Save size={15} /> VAULT IT
                </button>
              </div>
            </div>
          </section>
        );
      }

      function Stat({ k, v }) {
        return (
          <div>
            <div className="font-mono text-[9px] tracking-[0.18em] text-muted-foreground uppercase">{k}</div>
            <div className="font-mono text-sm mt-1">{v}</div>
          </div>
        );
      }

      /* ============== AlchemyStudio ============== */
      const tabs = [
        { id: "dna", label: "GEOMETRIC DNA", icon: Square },
        { id: "frame", label: "FRAME ARCHITECTURE", icon: Frame },
        { id: "ecc", label: "ERROR CORRECTION", icon: ShieldCheck },
      ];
      const palettes = [
        { name: "Obsidian", fg: "#1A1A1B", bg: "#FFFFFF" },
        { name: "Neo-Mint", fg: "#00E599", bg: "#0B0F0E" },
        { name: "Blueprint", fg: "#0F172A", bg: "#E2E8F0" },
        { name: "Ember", fg: "#B45309", bg: "#FFF7ED" },
        { name: "Mono-Inverted", fg: "#FFFFFF", bg: "#1A1A1B" },
      ];
      const eccLevels = ["L", "M", "Q", "H"];

      function AlchemyStudio({ config, setConfig }) {
        const [tab, setTab] = useState("dna");

        return (
          <section id="studio" className="py-24 lg:py-28 border-t border-border">
            <div className="max-w-[1600px] mx-auto px-6 lg:px-10">
              <header className="mb-10 flex items-end justify-between flex-wrap gap-4">
                <div>
                  <span className="font-mono text-[11px] tracking-[0.2em] text-accent">// ALCHEMY STUDIO</span>
                  <h2 className="mt-3 font-heading font-extrabold tracking-[-0.04em] text-[clamp(1.9rem,4vw,3rem)] leading-tight">
                    Customize the lattice.
                  </h2>
                  <p className="mt-3 text-muted-foreground max-w-lg">
                    Professional styling without the clutter. Visual attribute cards let you reconfigure geometry, framing and resilience in one tap.
                  </p>
                </div>
                <div className="flex gap-2 flex-wrap">
                  {tabs.map((t) => {
                    const Icon = t.icon;
                    return (
                      <button
                        key={t.id}
                        onClick={() => setTab(t.id)}
                        className={"flex items-center gap-2 font-mono text-[10px] tracking-[0.16em] px-3 py-2 rounded-md border transition-colors " + (tab === t.id ? "border-accent text-accent bg-accent/5" : "border-border text-muted-foreground hover:text-foreground")}
                      >
                        <Icon size={13} /> {t.label}
                      </button>
                    );
                  })}
                </div>
              </header>

              <motion.div
                key={tab}
                initial={{ opacity: 0, y: 12 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.3 }}
                className="grid md:grid-cols-3 lg:grid-cols-5 gap-4"
              >
                {tab === "dna" && (
                  <>
                    <DnaCard active={config.shape === "square"} onClick={() => setConfig((c) => ({ ...c, shape: "square" }))} title="Square Modules" desc="Crisp pixel grid. Maximum density." icon={Square} />
                    <DnaCard active={config.shape === "round"} onClick={() => setConfig((c) => ({ ...c, shape: "round" }))} title="Round Modules" desc="Soft dot lattice. Editorial feel." icon={Circle} />
                    <DnaCard active={false} onClick={() => {}} title="Dot Matrix" desc="Variable density tessellation." icon={Sliders} />
                    <DnaCard active={false} onClick={() => {}} title="Line Scan" desc="Horizontal connector topology." icon={Frame} />
                    <DnaCard active={false} onClick={() => {}} title="Hex Tiling" desc="Six-axis honeycomb modules." icon={Palette} />
                  </>
                )}

                {tab === "frame" && (
                  palettes.map((p) => (
                    <button
                      key={p.name}
                      onClick={() => setConfig((c) => ({ ...c, fgColor: p.fg, bgColor: p.bg }))}
                      className={"text-left rounded-xl border p-5 transition-all " + (config.fgColor.toLowerCase() === p.fg.toLowerCase() ? "border-accent ring-1 ring-accent" : "border-border hover:border-foreground/30")}
                    >
                      <div className="h-20 rounded-lg mb-4 grid place-content-center" style={{ background: p.bg }}>
                        <div className="w-10 h-10 rounded grid grid-cols-3 gap-[2px] p-1" style={{ background: p.bg }}>
                          {Array.from({ length: 9 }).map((_, i) => (
                            <span key={i} style={{ background: p.fg }} className="rounded-[1px]" />
                          ))}
                        </div>
                      </div>
                      <div className="font-mono text-[10px] tracking-[0.16em] text-muted-foreground">PALETTE</div>
                      <div className="font-heading font-bold mt-1">{p.name}</div>
                    </button>
                  ))
                )}

                {tab === "ecc" && (
                  eccLevels.map((lvl) => (
                    <button
                      key={lvl}
                      onClick={() => setConfig((c) => ({ ...c, eccLevel: lvl }))}
                      className={"text-left rounded-xl border p-6 transition-all " + (config.eccLevel === lvl ? "border-accent ring-1 ring-accent bg-accent/5" : "border-border hover:border-foreground/30")}
                    >
                      <div className="font-heading font-extrabold text-3xl tracking-tight">{lvl}</div>
                      <div className="font-mono text-[10px] tracking-[0.16em] text-muted-foreground mt-2">
                        {({ L: "7%", M: "15%", Q: "25%", H: "30%" })[lvl]} RECOVERY
                      </div>
                      <p className="text-sm text-muted-foreground mt-3">
                        {lvl === "H" ? "High noise tolerance. Ideal for print & overlays." : lvl === "L" ? "Smallest footprint, clean surfaces only." : "Balanced resilience for general use."}
                      </p>
                    </button>
                  ))
                )}
              </motion.div>

              <div className="mt-6 grid sm:grid-cols-3 gap-4">
                <div className="rounded-xl border border-border p-5">
                  <div className="font-mono text-[10px] tracking-[0.16em] text-muted-foreground mb-2">SIZE · {config.size}px</div>
                  <input type="range" min={128} max={1024} step={32} value={config.size} onChange={(e) => setConfig((c) => ({ ...c, size: Number(e.target.value) }))} className="w-full accent-accent" />
                </div>
                <div className="rounded-xl border border-border p-5">
                  <div className="font-mono text-[10px] tracking-[0.16em] text-muted-foreground mb-2">QUIET ZONE · {config.margin}</div>
                  <input type="range" min={0} max={8} value={config.margin} onChange={(e) => setConfig((c) => ({ ...c, margin: Number(e.target.value) }))} className="w-full accent-accent" />
                </div>
                <div className="rounded-xl border border-border p-5 flex items-center justify-between gap-3">
                  <div>
                    <div className="font-mono text-[10px] tracking-[0.16em] text-muted-foreground mb-1">FG / BG</div>
                    <div className="flex gap-2">
                      <input type="color" value={config.fgColor} onChange={(e) => setConfig((c) => ({ ...c, fgColor: e.target.value }))} className="w-10 h-9 rounded border border-border bg-transparent cursor-pointer" />
                      <input type="color" value={config.bgColor} onChange={(e) => setConfig((c) => ({ ...c, bgColor: e.target.value }))} className="w-10 h-9 rounded border border-border bg-transparent cursor-pointer" />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      function DnaCard({ active, onClick, title, desc, icon: Icon }) {
        return (
          <button
            onClick={onClick}
            className={"text-left rounded-xl border p-5 transition-all group " + (active ? "border-accent ring-1 ring-accent bg-accent/5" : "border-border hover:border-foreground/30")}
          >
            <div className="w-10 h-10 rounded-md border border-border grid place-content-center mb-4 group-hover:border-accent transition-colors">
              <Icon size={18} />
            </div>
            <div className="font-heading font-bold">{title}</div>
            <p className="text-sm text-muted-foreground mt-1.5">{desc}</p>
          </button>
        );
      }

      /* ============== ScanIntelligence ============== */
      const pings = [
        { city: "Erbbil", x: 58, y: 38 },
        { city: "Berlin", x: 51, y: 28 },
        { city: "Tokyo", x: 83, y: 39 },
        { city: "São Paulo", x: 32, y: 70 },
        { city: "New York", x: 24, y: 35 },
        { city: "Cape Town", x: 53, y: 76 },
      ];
      const heat = Array.from({ length: 72 }).map(() => Math.random());

      function ScanIntelligence() {
        const [feed, setFeed] = useState(pings.slice(0, 4));
        const [tick, setTick] = useState(0);

        useEffect(() => {
          const id = setInterval(() => {
            setTick((t) => t + 1);
            setFeed((f) => {
              const next = pings[Math.floor(Math.random() * pings.length)];
              return [{ ...next, id: Math.random() }, ...f].slice(0, 5);
            });
          }, 2400);
          return () => clearInterval(id);
        }, []);

        return (
          <section id="analyze" className="py-24 lg:py-28 border-t border-border bg-secondary/40">
            <div className="max-w-[1600px] mx-auto px-6 lg:px-10">
              <header className="mb-12">
                <span className="font-mono text-[11px] tracking-[0.2em] text-accent">// SCAN INTELLIGENCE</span>
                <h2 className="mt-3 font-heading font-extrabold tracking-[-0.04em] text-[clamp(1.9rem,4vw,3rem)] leading-tight">
                  Read the telemetry.
                </h2>
                <p className="mt-3 text-muted-foreground max-w-lg">
                  Dynamic codes aren't static. Heat-map topography and a live scan feed reveal where, when and how often your gateways are crossed.
                </p>
              </header>

              <div className="grid lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 rounded-xl border border-border bg-card p-6 lg:p-8">
                  <div className="flex items-center justify-between mb-6">
                    <div className="flex items-center gap-2">
                      <TrendingUp size={15} className="text-accent" />
                      <span className="font-mono text-[11px] tracking-[0.16em] text-muted-foreground">SCAN TOPOGRAPHY · 24H</span>
                    </div>
                    <span className="font-mono text-[10px] tracking-[0.16em] text-accent">● STREAMING</span>
                  </div>
                  <div className="grid grid-cols-[repeat(24,1fr)] gap-[3px]">
                    {heat.map((h, i) => (
                      <motion.span
                        key={i}
                        initial={{ opacity: 0.2 }}
                        animate={{ opacity: 0.2 + h * 0.8 }}
                        transition={{ duration: 0.6, delay: (i % 24) * 0.01 }}
                        className="aspect-square rounded-[2px]"
                        style={{ background: "hsl(158 100% " + (28 + h * 32) + "%)" }}
                      />
                    ))}
                  </div>
                  <div className="mt-6 grid grid-cols-3 gap-4 pt-6 border-t border-border">
                    <Metric label="TOTAL SCANS" value="48,219" />
                    <Metric label="UNIQUE DEVICES" value="12,904" />
                    <Metric label="CONVERSION" value="34.6%" />
                  </div>
                </div>

                <div className="rounded-xl border border-border bg-card p-6 lg:p-8 flex flex-col">
                  <div className="flex items-center gap-2 mb-6">
                    <MapPin size={15} className="text-accent" />
                    <span className="font-mono text-[11px] tracking-[0.16em] text-muted-foreground">LIVE PING FEED</span>
                  </div>
                  <div className="relative aspect-[4/3] rounded-lg border border-border bg-background overflow-hidden mb-5">
                    <div className="absolute inset-0 micro-grid opacity-50" />
                    {pings.map((p, i) => (
                      <span key={i} className="absolute w-2.5 h-2.5 rounded-full" style={{ left: p.x + "%", top: p.y + "%", background: "hsl(var(--accent))" }}>
                        <span className="absolute inset-0 rounded-full bg-accent animate-pulse-mint" />
                      </span>
                    ))}
                  </div>
                  <div className="space-y-2.5 flex-1">
                    {feed.map((f) => (
                      <motion.div
                        key={f.id}
                        initial={{ opacity: 0, x: -10 }}
                        animate={{ opacity: 1, x: 0 }}
                        className="flex items-center justify-between text-sm"
                      >
                        <span className="flex items-center gap-2 font-mono text-xs">
                          <Activity size={12} className="text-accent" /> {f.city}
                        </span>
                        <span className="font-mono text-[10px] tracking-wider text-muted-foreground">SCAN · {f.x}.{f.y}</span>
                      </motion.div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      function Metric({ label, value }) {
        return (
          <div>
            <div className="font-mono text-[9px] tracking-[0.18em] text-muted-foreground uppercase">{label}</div>
            <div className="font-heading font-extrabold text-2xl tracking-tight mt-1">{value}</div>
          </div>
        );
      }

      /* ============== EnterpriseVault ============== */
      function EnterpriseVault({ vault, setVault, currentConfig }) {
        const [selected, setSelected] = useState(new Set());

        const mint = () =>
          setVault((v) => [
            {
              id: Math.random().toString(36).slice(2, 9),
              text: currentConfig.text || "https://qrforge.io",
              fg: currentConfig.fgColor,
              bg: currentConfig.bgColor,
              ecc: currentConfig.eccLevel,
              date: new Date().toLocaleDateString(),
            },
            ...v,
          ]);

        const toggle = (id) =>
          setSelected((s) => {
            const next = new Set(s);
            next.has(id) ? next.delete(id) : next.add(id);
            return next;
          });

        const toggleAll = () =>
          setSelected((s) => (s.size === vault.length ? new Set() : new Set(vault.map((v) => v.id))));

        const removeSelected = () => {
          setVault((v) => v.filter((x) => !selected.has(x.id)));
          setSelected(new Set());
        };

        return (
          <section id="vault" className="py-24 lg:py-28 border-t border-border">
            <div className="max-w-[1600px] mx-auto px-6 lg:px-10">
              <header className="mb-10 flex items-end justify-between flex-wrap gap-4">
                <div>
                  <span className="font-mono text-[11px] tracking-[0.2em] text-accent">// ENTERPRISE VAULT</span>
                  <h2 className="mt-3 font-heading font-extrabold tracking-[-0.04em] text-[clamp(1.9rem,4vw,3rem)] leading-tight">
                    Your code estate.
                  </h2>
                  <p className="mt-3 text-muted-foreground max-w-lg">
                    A high-density ledger of every gateway you've forged. Bulk actions appear only when needed.
                  </p>
                </div>
                <button
                  onClick={mint}
                  disabled={!currentConfig.text}
                  className="flex items-center gap-2 font-mono text-[12px] tracking-wider px-5 py-3 rounded-md bg-primary text-primary-foreground hover:opacity-90 transition-opacity disabled:opacity-40"
                >
                  <Plus size={15} /> MINT TO VAULT
                </button>
              </header>

              <div className="rounded-xl border border-border bg-card overflow-hidden">
                <div className="grid grid-cols-[40px_1fr_120px_80px_100px_40px] gap-3 px-5 py-3 border-b border-border bg-secondary/50 font-mono text-[9px] tracking-[0.18em] text-muted-foreground uppercase">
                  <div className="flex justify-center">
                    {vault.length > 0 && (
                      <button onClick={toggleAll}>
                        {selected.size === vault.length ? <CheckSquare size={13} /> : <Square size={13} />}
                      </button>
                    )}
                  </div>
                  <div>Payload</div>
                  <div>Palette</div>
                  <div>ECC</div>
                  <div>Date</div>
                  <div></div>
                </div>

                {vault.length === 0 ? (
                  <div className="px-5 py-16 text-center flex flex-col items-center gap-3 text-muted-foreground">
                    <Database size={28} className="text-muted-foreground/50" />
                    <p className="font-mono text-xs tracking-wider">VAULT EMPTY — MINT YOUR FIRST CODE</p>
                  </div>
                ) : (
                  vault.map((v) => (
                    <div
                      key={v.id}
                      className="grid grid-cols-[40px_1fr_120px_80px_100px_40px] gap-3 px-5 py-3.5 border-b border-border last:border-0 items-center text-sm hover:bg-secondary/40 transition-colors"
                    >
                      <div className="flex justify-center">
                        <button onClick={() => toggle(v.id)}>
                          {selected.has(v.id) ? <CheckSquare size={15} className="text-accent" /> : <Square size={15} className="text-muted-foreground" />}
                        </button>
                      </div>
                      <div className="font-mono text-xs truncate" title={v.text}>{v.text}</div>
                      <div className="flex gap-1.5">
                        <span className="w-5 h-5 rounded border border-border" style={{ background: v.bg }} />
                        <span className="w-5 h-5 rounded border border-border" style={{ background: v.fg }} />
                      </div>
                      <div className="font-mono text-xs text-muted-foreground">{v.ecc}</div>
                      <div className="font-mono text-xs text-muted-foreground">{v.date}</div>
                      <div className="flex justify-center">
                        <button
                          onClick={() => setVault((arr) => arr.filter((x) => x.id !== v.id))}
                          className="text-muted-foreground hover:text-destructive transition-colors"
                        >
                          <Trash2 size={14} />
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>

              {selected.size > 0 && (
                <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 glass-isolate border border-border rounded-full px-5 py-3 flex items-center gap-4 shadow-xl">
                  <span className="font-mono text-xs tracking-wider">{selected.size} SELECTED</span>
                  <button
                    onClick={removeSelected}
                    className="flex items-center gap-1.5 font-mono text-[11px] tracking-wider text-destructive hover:opacity-80 transition-opacity"
                  >
                    <Trash2 size={13} /> PURGE
                  </button>
                </div>
              )}
            </div>
          </section>
        );
      }

      /* ============== SiteFooter ============== */
      const footerCols = [
        { head: "GENERATE", links: [ { label: "URL Codes", href: "#generate" }, { label: "vCard / Contact", href: "#generate" }, { label: "Wi-Fi Share", href: "#generate" }, { label: "Bulk Studio", href: "#studio" } ] },
        { head: "ANALYZE", links: [ { label: "Scan Topography", href: "#analyze" }, { label: "Live Feed", href: "#analyze" }, { label: "Geo Heatmap", href: "#analyze" } ] },
        { head: "MANAGE", links: [ { label: "Enterprise Vault", href: "#vault" }, { label: "Bulk Export", href: "#vault" }, { label: "Team Access", href: "#vault" } ] },
        { head: "COMPANY", links: [ { label: "About", href: "#" }, { label: "Privacy", href: "#" }, { label: "Terms", href: "#" }, { label: "Support", href: "#" } ] },
      ];

      function SiteFooter() {
        return (
          <footer className="bg-primary text-primary-foreground">
            <div className="max-w-[1600px] mx-auto px-6 lg:px-10 py-16 lg:py-20">
              <div className="grid lg:grid-cols-[1.5fr_repeat(4,1fr)] gap-10 lg:gap-8">
                <div>
                  <div className="flex items-center gap-2.5 mb-4">
                    <span className="grid place-content-center w-8 h-8 rounded-md bg-accent text-accent-foreground">
                      <QrCode size={18} />
                    </span>
                    <span className="font-heading font-extrabold tracking-tight text-[15px]">
                      QR<span className="text-accent">FORGE</span>
                    </span>
                  </div>
                  <p className="font-mono text-[11px] tracking-[0.14em] leading-relaxed text-primary-foreground/60 max-w-xs">
                    STRUCTURAL CLARITY FOR MODERN CONNECTIVITY. EVERY PIXEL, A DATA-POINT. EVERY SCAN, A BRIDGE.
                  </p>
                  <div className="flex gap-3 mt-6">
                    {[Github, Twitter, Linkedin].map((Icon, i) => (
                      <a key={i} href="#" className="w-9 h-9 rounded-md border border-primary-foreground/15 grid place-content-center hover:border-accent hover:text-accent transition-colors">
                        <Icon size={15} />
                      </a>
                    ))}
                  </div>
                </div>

                {footerCols.map((c) => (
                  <div key={c.head}>
                    <div className="font-mono text-[10px] tracking-[0.2em] text-accent mb-4">{c.head}</div>
                    <ul className="space-y-2.5">
                      {c.links.map((l) => (
                        <li key={l.label}>
                          <a href={l.href} className="font-mono text-[11px] tracking-[0.1em] text-primary-foreground/70 hover:text-primary-foreground transition-colors">
                            {l.label}
                          </a>
                        </li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>

              <div className="mt-16 pt-8 border-t border-primary-foreground/10 flex flex-wrap items-center justify-between gap-4">
                <span className="font-mono text-[10px] tracking-[0.18em] text-primary-foreground/40">© 2026 QRFORGE / DIGITAL GATEWAY COMMAND CENTER</span>
                <span className="font-mono text-[10px] tracking-[0.18em] text-primary-foreground/40">BUILT WITH STRUCTURAL CLARITY — v2.0.1</span>
              </div>
            </div>
          </footer>
        );
      }

      /* ============== ScanTestModal ============== */
      function ScanTestModal({ open, onClose, config }) {
        const [ctx, setCtx] = useState("card");

        if (!open) return null;

        return (
          <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
            <div className="absolute inset-0 bg-foreground/70 backdrop-blur-sm" onClick={onClose} />
            <div className="relative glass-isolate rounded-2xl border border-border w-full max-w-lg p-7 lg:p-9 bg-background">
              <button onClick={onClose} className="absolute top-4 right-4 text-muted-foreground hover:text-foreground transition-colors">
                <X size={20} />
              </button>

              <div className="mb-6">
                <span className="font-mono text-[11px] tracking-[0.2em] text-accent">// FINAL VERIFICATION</span>
                <h3 className="mt-2 font-heading font-extrabold text-2xl tracking-tight">Scan-to-Test</h3>
                <p className="text-sm text-muted-foreground mt-1">Verify scan-ability at 100% scale against real-world contexts.</p>
              </div>

              <div className="flex gap-2 mb-6">
                {[
                  { id: "card", label: "CARD", icon: CreditCard },
                  { id: "window", label: "STOREFRONT", icon: Store },
                ].map((t) => {
                  const Icon = t.icon;
                  return (
                    <button
                      key={t.id}
                      onClick={() => setCtx(t.id)}
                      className={"flex items-center gap-2 font-mono text-[10px] tracking-[0.16em] px-3 py-2 rounded-md border transition-colors " + (ctx === t.id ? "border-accent text-accent bg-accent/5" : "border-border text-muted-foreground")}
                    >
                      <Icon size={13} /> {t.label}
                    </button>
                  );
                })}
              </div>

              <div className="rounded-xl border border-border p-8 flex items-center justify-center min-h-[280px] relative overflow-hidden">
                {ctx === "card" ? (
                  <div className="w-full max-w-[300px] aspect-[1.75/1] bg-gradient-to-br from-foreground to-foreground/90 rounded-xl p-5 flex items-center justify-between shadow-2xl">
                    <div>
                      <div className="font-heading font-extrabold text-primary-foreground text-lg tracking-tight">QRFORGE</div>
                      <div className="font-mono text-[9px] tracking-widest text-primary-foreground/50 mt-1">DIGITAL GATEWAY</div>
                      <div className="font-mono text-[9px] tracking-widest text-primary-foreground/40 mt-6">HTTPS://QRFORGE.IO</div>
                    </div>
                    <div className="bg-background rounded-lg p-2">
                      <QRCodeCanvas value={config.text || " "} size={96} level={config.eccLevel} fgColor={config.fgColor} bgColor={config.bgColor} />
                    </div>
                  </div>
                ) : (
                  <div className="w-full aspect-[4/3] bg-gradient-to-b from-background to-secondary border border-border rounded-xl relative flex items-center justify-center">
                    <div className="absolute inset-0 micro-grid opacity-40" />
                    <div className="absolute top-4 left-4 font-mono text-[9px] tracking-widest text-muted-foreground">// STOREFRONT GLASS</div>
                    <div className="relative bg-card rounded-xl p-4 shadow-xl border border-border">
                      <QRCodeCanvas value={config.text || " "} size={120} level={config.eccLevel} fgColor={config.fgColor} bgColor={config.bgColor} />
                    </div>
                  </div>
                )}
              </div>

              <p className="mt-4 font-mono text-[10px] tracking-[0.16em] text-muted-foreground text-center">
                {config.text ? "✓ READY TO SCAN — POINT ANY CAMERA AT THE OUTPUT" : "⚠ ENCODE A TARGET TO VERIFY"}
              </p>
            </div>
          </div>
        );
      }

      /* ============== Home (root) ============== */
      const STORAGE_KEY = "qrforge_vault";

      function Home() {
        const [config, setConfig] = useState({
          text: "https://qrforge.io",
          fgColor: "#1A1A1B",
          bgColor: "#FFFFFF",
          eccLevel: "M",
          margin: 2,
          size: 256,
          shape: "square",
        });
        const [vault, setVault] = useState([]);
        const [testOpen, setTestOpen] = useState(false);

        useEffect(() => {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) setVault(JSON.parse(raw));
          } catch {}
        }, []);

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(vault));
          } catch {}
        }, [vault]);

        return (
          <div id="top" className="min-h-screen relative text-foreground">
            <LiveBackground />
            <div className="relative z-10">
              <GhostNav />
              <main>
                <QrGenerator
                  config={config}
                  setConfig={setConfig}
                  onSave={() =>
                    setVault((v) => [
                      {
                        id: Math.random().toString(36).slice(2, 9),
                        text: config.text || "https://qrforge.io",
                        fg: config.fgColor,
                        bg: config.bgColor,
                        ecc: config.eccLevel,
                        date: new Date().toLocaleDateString(),
                      },
                      ...v,
                    ])
                  }
                  onOpenTest={() => setTestOpen(true)}
                />
                <AlchemyStudio config={config} setConfig={setConfig} />
                <ScanIntelligence />
                <EnterpriseVault vault={vault} setVault={setVault} currentConfig={config} />
              </main>
              <SiteFooter />
              <ScanTestModal open={testOpen} onClose={() => setTestOpen(false)} config={config} />
            </div>
          </div>
        );
      }

      const root = createRoot(document.getElementById("root"));
      root.render(<Home />);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
